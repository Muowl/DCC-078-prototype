<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama UML - Prototype</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #ffffff; }
        svg { display: block; width: 1180px; max-width: 100%; height: auto; }
        .nome { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; fill: #2d3142; }
        .membro { font-family: Consolas, monospace; font-size: 12px; fill: #2d3142; }
        .tag { font-family: Consolas, monospace; font-size: 11px; text-anchor: middle; fill: #4f5d75; }
    </style>
</head>
<body>
<svg viewBox="0 0 1180 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagrama-uml-title diagrama-uml-desc">
    <title id="diagrama-uml-title">Diagrama de classes do padrão Prototype</title>
    <desc id="diagrama-uml-desc">RegistroModelos guarda objetos ModeloDocumento e devolve clones; Contrato e Procuracao realizam a interface e Contrato compõe Parte, copiada em profundidade.</desc>
    <defs>
        <marker id="heranca" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,16 6,0 12" fill="#ffffff" stroke="#2d3142"/></marker>
        <marker id="associacao" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#4f5d75"/></marker>
        <marker id="agregacao" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 5,9 0,18 5,9 10" fill="#ffffff" stroke="#2d3142"/></marker>
        <marker id="composicao" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 5,9 0,18 5,9 10" fill="#2d3142" stroke="#2d3142"/></marker>
    </defs>
    <rect width="1180" height="900" fill="#ffffff"/>

    <line x1="540" y1="90" x2="680" y2="90" stroke="#4f5d75" marker-end="url(#associacao)"/>
    <rect x="546" y="68" width="16" height="16" fill="#ffffff"/><text x="548" y="80" class="membro">1</text>
    <rect x="638" y="68" width="40" height="16" fill="#ffffff"/><text x="640" y="80" class="membro">0..*</text>
    <path d="M320 330 V270 H800 V140" fill="none" stroke="#2d3142" stroke-dasharray="5,4" marker-end="url(#heranca)"/>
    <path d="M920 330 V140" fill="none" stroke="#2d3142" stroke-dasharray="5,4" marker-end="url(#heranca)"/>
    <line x1="320" y1="570" x2="320" y2="660" stroke="#2d3142" marker-start="url(#composicao)"/>
    <rect x="328" y="638" width="16" height="16" fill="#ffffff"/><text x="330" y="650" class="membro">1</text>

    <g id="registro-modelos">
        <rect x="40" y="40" width="500" height="120" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M46 40 H534 Q540 40 540 46 V76 H40 V46 Q40 40 46 40" fill="#f1f3f5"/>
        <text x="290" y="63" class="nome">RegistroModelos</text>
        <line x1="40" y1="76" x2="540" y2="76" stroke="#bfc0c0"/>
        <text x="54" y="96" class="membro">- modelos: Map&lt;String, ModeloDocumento&gt; {readOnly}</text>
        <line x1="40" y1="108" x2="540" y2="108" stroke="#bfc0c0"/>
        <text x="54" y="128" class="membro">+ registrar(String, ModeloDocumento): void</text>
        <text x="54" y="148" class="membro">+ criar(String): ModeloDocumento</text>
    </g>
    <g id="modelo-documento">
        <rect x="680" y="40" width="440" height="100" rx="6" fill="#ffffff" stroke="#eb6c36"/>
        <rect x="680" y="40" width="440" height="100" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
        <path d="M686 40 H1114 Q1120 40 1120 46 V88 H680 V46 Q680 40 686 40" fill="#fff1eb"/>
        <text x="900" y="59" class="tag">«interface»</text>
        <text x="900" y="78" class="nome">ModeloDocumento</text>
        <line x1="680" y1="88" x2="1120" y2="88" stroke="#bfc0c0"/>
        <text x="694" y="108" class="membro">+ clonar(): ModeloDocumento</text>
        <text x="694" y="128" class="membro">+ resumo(): String</text>
    </g>
    <g id="contrato">
        <rect x="40" y="330" width="560" height="240" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M46 330 H594 Q600 330 600 336 V366 H40 V336 Q40 330 46 330" fill="#f1f3f5"/>
        <text x="320" y="353" class="nome">Contrato</text>
        <line x1="40" y1="366" x2="600" y2="366" stroke="#bfc0c0"/>
        <text x="54" y="386" class="membro">- titulo: String</text>
        <text x="54" y="406" class="membro">- contratante: Parte</text>
        <text x="54" y="426" class="membro">- clausulas: List&lt;String&gt;</text>
        <line x1="40" y1="438" x2="600" y2="438" stroke="#bfc0c0"/>
        <text x="54" y="458" class="membro">+ setTitulo(String): void</text>
        <text x="54" y="478" class="membro">+ getContratante(): Parte</text>
        <text x="54" y="498" class="membro">+ adicionarClausula(String): void</text>
        <text x="54" y="518" class="membro">+ getClausulas(): List&lt;String&gt;</text>
        <text x="54" y="538" class="membro">+ clonar(): Contrato</text>
        <text x="54" y="558" class="membro">+ resumo(): String</text>
    </g>
    <g id="procuracao">
        <rect x="700" y="330" width="440" height="200" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M706 330 H1134 Q1140 330 1140 336 V366 H700 V336 Q700 330 706 330" fill="#f1f3f5"/>
        <text x="920" y="353" class="nome">Procuracao</text>
        <line x1="700" y1="366" x2="1140" y2="366" stroke="#bfc0c0"/>
        <text x="714" y="386" class="membro">- outorgante: String</text>
        <text x="714" y="406" class="membro">- poderes: List&lt;String&gt;</text>
        <line x1="700" y1="418" x2="1140" y2="418" stroke="#bfc0c0"/>
        <text x="714" y="438" class="membro">+ setOutorgante(String): void</text>
        <text x="714" y="458" class="membro">+ adicionarPoder(String): void</text>
        <text x="714" y="478" class="membro">+ getPoderes(): List&lt;String&gt;</text>
        <text x="714" y="498" class="membro">+ clonar(): Procuracao</text>
        <text x="714" y="518" class="membro">+ resumo(): String</text>
    </g>
    <g id="parte">
        <rect x="40" y="660" width="560" height="200" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M46 660 H594 Q600 660 600 666 V696 H40 V666 Q40 660 46 660" fill="#f1f3f5"/>
        <text x="320" y="683" class="nome">Parte</text>
        <line x1="40" y1="696" x2="600" y2="696" stroke="#bfc0c0"/>
        <text x="54" y="716" class="membro">- nome: String</text>
        <text x="54" y="736" class="membro">- documento: String</text>
        <line x1="40" y1="748" x2="600" y2="748" stroke="#bfc0c0"/>
        <text x="54" y="768" class="membro">+ Parte(Parte)</text>
        <text x="54" y="788" class="membro">+ getNome(): String</text>
        <text x="54" y="808" class="membro">+ setNome(String): void</text>
        <text x="54" y="828" class="membro">+ getDocumento(): String</text>
        <text x="54" y="848" class="membro">+ setDocumento(String): void</text>
    </g>
</svg>
</body>
</html>
